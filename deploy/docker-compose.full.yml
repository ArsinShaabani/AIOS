# AIOS — full profile for a larger host: Postgres, Redis, Qdrant, Ollama,
# faster-whisper and Piper. Useful for development and multi-instance setups.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aios
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aios}
      POSTGRES_DB: aios
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aios"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant:/qdrant/storage]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    # On CPU-only hosts pull a small model: docker exec -it ollama ollama pull qwen2.5:1.5b

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      ASR_MODEL: small
      ASR_ENGINE: faster_whisper
    ports: ["8000:9000"]

  piper:
    image: rhasspy/wyoming-piper:latest
    command: ["--voice", "en_US-lessac-medium"]
    ports: ["10200:10200"]

  aios:
    build: .
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      AIOS_APP_ENV: production
      AIOS_APP_DATA_DIR: /data
      AIOS_DATABASE_DRIVER: postgres
      AIOS_DATABASE_DSN: postgres://aios:${POSTGRES_PASSWORD:-aios}@postgres:5432/aios?sslmode=disable
      AIOS_CACHE_DRIVER: redis
      AIOS_CACHE_REDIS_ADDR: redis:6379
      AIOS_QUEUE_DRIVER: redis
      AIOS_VECTOR_DRIVER: qdrant
      AIOS_VECTOR_QDRANT_URL: http://qdrant:6333
      AIOS_LLM_DEFAULT_PROVIDER: ollama
      AIOS_LLM_DEFAULT_MODEL: qwen2.5:1.5b
      AIOS_LLM_EMBEDDING_PROVIDER: local
      AIOS_VOICE_STT_PROVIDER: whisper_http
      AIOS_VOICE_STT_BASE_URL: http://whisper:9000/v1
      AIOS_VOICE_TTS_PROVIDER: piper_http
      AIOS_VOICE_TTS_BASE_URL: http://piper:10200
      AIOS_SECURITY_BOOTSTRAP_EMAIL: admin@aios.local
      AIOS_SECURITY_BOOTSTRAP_PASSWORD: ${AIOS_ADMIN_PASSWORD:?set AIOS_ADMIN_PASSWORD}
      AIOS_SERVER_CORS_ORIGINS: http://localhost:8080
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - aios-data:/data
    restart: unless-stopped

volumes:
  pgdata:
  qdrant:
  ollama:
  aios-data:
