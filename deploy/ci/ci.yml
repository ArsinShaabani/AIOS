name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Format check
        run: test -z "$(gofmt -l internal cmd tests)"
      - name: Vet
        run: go vet ./...
      - name: Tests with coverage
        run: go test -race -count=1 -covermode=atomic -coverpkg=./internal/... -coverprofile=coverage.out ./internal/... ./tests/e2e/...
      - name: Coverage report
        run: go tool cover -func=coverage.out | tail -1
      - name: Coverage gates
        run: ./scripts/coverage-gate.sh
      - name: Build (amd64)
        run: CGO_ENABLED=0 go build -trimpath -o dist/aios ./cmd/aios
      - name: Build (arm64 / Raspberry Pi)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o dist/aios-arm64 ./cmd/aios
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: aios:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
